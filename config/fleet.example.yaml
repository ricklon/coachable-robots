# fleet.example.yaml — Reference fleet configuration
#
# Copy to fleet.yaml and edit for your lab setup.
# fleet.yaml is gitignored — never commit real station assignments.
#
# Usage:
#   coachable fleet --list
#   coachable preview --robot alpha
#   coachable collect --robot alpha --dataset pick_block --episodes 20

fleet:
  name: coachable-lab-01

  robots:
    - name: alpha                    # short slug used in --robot flag
      type: so101                    # robot type (so101, car, etc.)
      leader_port: /dev/ttyACM0
      follower_port: /dev/ttyACM1
      cameras:                       # named cameras → /dev/video{N}
        top: 0                       # Logitech C920e — /dev/video0
        gripper: 2                   # SVPRO OV2710 fisheye — /dev/video2
                                     # Note: video1 and video3 are UVC metadata nodes, not capture
      camera_config:
        top:
          width: 1280
          height: 720
          fps: 30
          fourcc: YUYV               # C920e: YUYV at 720p gives best color accuracy
        gripper:
          width: 1920
          height: 1080
          fps: 30
          fourcc: MJPG               # OV2710: must use MJPG — YUYV is only 6fps at 1080p
          # Hardware: SVPRO USB Camera Board, OV2710 sensor, 150° FOV fisheye lens
          # v4l2 setup required before capture:
          #   v4l2-ctl --device=/dev/video2 \
          #     --set-ctrl=exposure_dynamic_framerate=0 \
          #     --set-ctrl=backlight_compensation=2
      coach: alice                   # name of assigned coach (from coaches list)
      status: available              # available | in_use | offline

    # Single-camera robot (old format still supported)
    - name: beta
      type: so101
      leader_port: /dev/ttyACM2
      follower_port: /dev/ttyACM3
      camera_index: 2                # legacy: equivalent to cameras: {top: 2}
      coach: null                    # unassigned
      status: available

# Coaches can be students, instructors, or agents
coaches:
  - name: alice
    hf_user: rianders                # HuggingFace username for dataset/model repos
    role: student                    # student | instructor | agent

  - name: bob
    hf_user: bobsmith
    role: student

  - name: coach-agent-01
    hf_user: coachable-lab
    role: agent                      # autonomous coach — same workflow as a student

hf:
  org: coachable-lab                 # HF org or username
  dataset_prefix: soarm101           # dataset repos: {hf_user}/{prefix}-{task}
  model_prefix: act                  # model repos:   {hf_user}/{prefix}-{task}
