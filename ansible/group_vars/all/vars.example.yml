---
# group_vars/all/vars.example.yml
# Copy this to vars.yml and fill in your instance values.
#
#   cp ansible/group_vars/all/vars.example.yml ansible/group_vars/all/vars.yml
#
# vars.yml is gitignored — it stays local to your fork/instance.

# HuggingFace
hf_user: "YOUR_HF_USERNAME"      # e.g. "ricklon"
hf_token: "{{ vault_hf_token }}" # set in vault.yml

# CHI@Edge application credential (from your RC file)
chi_credential_id: "{{ vault_chi_credential_id }}"
chi_credential_secret: "{{ vault_chi_credential_secret }}"

# Control node (KVM@TACC) — set after provisioning
control_floating_ip: "{{ vault_control_floating_ip }}"   # set in vault.yml after first provision

# Tailscale — reusable+ephemeral key; hostnames set per-node at provision time
# Control node: enrolled interactively as coachable-robots-control (persistent)
# MI100:        just provision-tailscale-node  → coachable-robots-mi100 (ephemeral)
# soarm101:     TS_AUTHKEY env var in container → soarm101 (ephemeral)
ts_authkey: "{{ vault_ts_authkey }}"

# Pi edge node — for SSH config on the control node
pi_host: "192.168.4.191"
pi_port: 22222
pi_ssh_private_key: "{{ vault_pi_ssh_private_key }}"     # set in vault.yml
pi_ssh_host_key: "{{ vault_pi_ssh_host_key }}"           # set in vault.yml (run: ssh-keyscan -p 22222 192.168.4.191)
