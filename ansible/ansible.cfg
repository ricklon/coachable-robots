[defaults]
inventory = inventory.yml
host_key_checking = False
timeout = 30
stdout_callback = yaml
# Bare metal nodes are slow to come up — be patient
gather_timeout = 60
# Vault password file — create this locally, never commit it
vault_password_file = .vault_pass

[ssh_connection]
# Chameleon bare metal can be slow on first connect
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o StrictHostKeyChecking=no
pipelining = True
