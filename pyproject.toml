[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coachable"
version = "0.1.0"
description = "Fleet management and coaching workflow for SO-ARM101 robots"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "gradio>=4.0",
    "opencv-python-headless>=4.8",
    "huggingface-hub[hf_xet]>=0.23",
    "python-chi>=1.0",
    "python-blazarclient>=4.5",
    "python-zunclient @ git+https://github.com/ChameleonCloud/python-zunclient.git",
    # Notebook verification and shared state
    "papermill>=2.6",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "ipywidgets>=8.0",
]

[project.scripts]
coachable = "coachable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
